services:
  - type: web
    name: smart-village-telehealth
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # ── Agora RTC (Primary video/audio provider) ──────────────────────────────
      # App ID from console.agora.io → your project → Basic Settings
      - key: AGORA_APP_ID
        value: "aab8b3f972274fcb87cc25048d089e94"
      # App Certificate from console.agora.io → your project → Basic Settings → Primary Certificate
      # Enables SERVER-SIDE dynamic token generation (tokens never expire manually!)
      # Copy the Primary Certificate value from Agora Console and set it in Render Dashboard env vars
      - key: AGORA_APP_CERTIFICATE
        value: ""   # ← Set this in Render Dashboard (not here) for security
      # Static fallback token — used only when AGORA_APP_CERTIFICATE is NOT set
      # Temp tokens expire in ~24h; prefer setting AGORA_APP_CERTIFICATE instead
      - key: AGORA_TOKEN
        value: ""   # ← Paste new temp token here when it expires (or set AGORA_APP_CERTIFICATE)
      - key: AGORA_CHANNEL
        value: "telehealth-room"
      - key: AGORA_ENABLED
        value: "true"
      # ── TURN relay (WebRTC fallback — kept for chat signaling only) ───────────
      - key: TURN_HOST
        value: global.relay.metered.ca
      - key: TURN_USERNAME
        value: ""
      - key: TURN_CREDENTIAL
        value: ""

